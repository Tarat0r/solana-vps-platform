FEFFDD"/><path d="M1229.025,304.62 L1229.025,314.62 L1239.025,314.62 L1229.025,304.62" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="847.35" y="323.517" fill="#000" font-size="13" textLength="347.074">All four account types are owned by the Solana program.</text><text x="847.35" y="341.223" fill="#000" font-size="13" textLength="355.693">Account addresses are derived from the PDA seeds above.</text><text x="847.35" y="358.929" fill="#000" font-size="13" textLength="353.6">Discriminators and bumps are omitted from this diagram.</text><text x="847.35" y="376.635" fill="#000" font-size="13" textLength="302.653">Provider, owner, payer, wallet, and treasury fields</text><text x="847.35" y="394.341" fill="#000" font-size="13" textLength="376.675">reference public keys, not additional program-owned entities.</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="58"><path d="M6,503.16 L6,583.984 A0,0 0 0 0 6,583.984 L382.368,583.984 A0,0 0 0 0 382.368,583.984 L382.368,513.16 L372.368,503.16 L198.18,503.16 L194.18,414.95 L190.18,503.16 L6,503.16 A0,0 0 0 0 6,503.16" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M372.368,503.16 L372.368,513.16 L382.368,513.16 L372.368,503.16" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="522.057" fill="#000" font-size="13" textLength="269.581">Initialized unpaid during server registration.</text><text x="12" y="539.763" fill="#000" font-size="13" textLength="278.252">Payment atomically updates the subscription,</text><text x="12" y="557.469" fill="#000" font-size="13" textLength="252.096">owner grant, and a new payment receipt.</text><text x="12" y="575.175" fill="#000" font-size="13" textLength="355.368">Delegated access also requires a valid owner subscription.</text></g><!--link ServerRecord to Subscription--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="45" data-link-type="association"><path d="M4