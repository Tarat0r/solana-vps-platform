version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solana-vps-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=sqlite:///data/solana-vps.sqlite?mode=rwc
      - RUST_LOG=backend=info,tower_http=info
      - TREASURY_WALLET=DemoTreasury111111111111111111111111111111
    volumes:
      - vps-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/orders"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=http://localhost:8080
    container_name: solana-vps-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy

volumes:
  vps-data:
    name: solana-vps-data
