[workspace]
members = ["auth-core", "solana-authd", "pam", "test-services"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
borsh = { version = "1", features = ["derive"] }
bs58 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-pubkey = { version = "2.4", features = ["curve25519"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "0.8"
auth-core = { path = "auth-core" }

# Lint levels for every crate; ./static-analysis.sh runs Clippy with -D warnings.
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# A panic in the PAM module or daemon aborts a login; unwrap and expect are for tests (clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
# Expiry times are i64 on chain and u64/usize locally.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
strip = true
lto = "thin"
