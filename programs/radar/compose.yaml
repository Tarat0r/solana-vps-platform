# Radar (https://github.com/Auditware/radar), a static analyzer for Anchor
# programs, for scripts/radar.sh. The services follow radar's own
# docker-compose.yml at commit 3439053, except that every image is pinned by
# digest, no port is published on the host, the containers can reach only each
# other, and the program is mounted read-only. Run it through scripts/radar.sh,
# which generates the throwaway credentials and removes everything afterwards.
name: wallet-ssh-radar

x-database: &database
  POSTGRES_DB: radar
  POSTGRES_USER: radar
  POSTGRES_PASSWORD: ${RADAR_DB_PASSWORD:?run scripts/radar.sh}
  POSTGRES_HOST: postgres
  POSTGRES_HOST_LOCAL: localhost
  POSTGRES_PORT: "5432"

x-api: &api
  <<: *database
  DEBUG: "1"
  DJANGO_SUPERUSER_USERNAME: radar
  DJANGO_SUPERUSER_PASSWORD: ${RADAR_ADMIN_PASSWORD:?run scripts/radar.sh}
  SECRET_KEY: ${RADAR_SECRET_KEY:?run scripts/radar.sh}
  RABBITMQ_USER: radar
  RABBITMQ_PASSWORD: ${RADAR_BROKER_PASSWORD:?run scripts/radar.sh}
  CELERY_BROKER_HOST: rabbitmq
  CELERY_BROKER_HOST_LOCAL: localhost
  CELERY_BROKER_PORT: "5672"

services:
  # Copies the program into radar_data, has the API parse it and run every
  # built-in template, then prints the findings and writes a report there.
  controller:
    image: ghcr.io/auditware/radar-controller@sha256:3d0d7ef4ec2566760de9c1c415ee917f8599ca3d1d5cfcd4ca0dd7100037d194
    environment:
      DJANGO_HOST: api
      DJANGO_HOST_LOCAL: localhost
      DJANGO_PORT: "8000"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - radar_data:/radar_data
      # The Anchor workspace without target/ and node_modules/.
      - ../Anchor.toml:/contract/Anchor.toml:ro
      - ../Cargo.toml:/contract/Cargo.toml:ro
      - ../billing-access:/contract/billing-access:ro

  # Its name must stay `api`: Django's ALLOWED_HOSTS lists it.
  api:
    image: ghcr.io/auditware/radar-api@sha256:7f8397ff1d0175bd7a943056ea2d34a452cf22dc010e3cd7a178cc7f8e563344
    environment: *api
    volumes:
      - radar_data:/radar_data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'bash -c "exec 6<> /dev/tcp/localhost/8000"']
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 20

  celeryworker:
    image: ghcr.io/auditware/radar-api@sha256:7f8397ff1d0175bd7a943056ea2d34a452cf22dc010e3cd7a178cc7f8e563344
    command: poetry run celery -A api worker -l info
    restart: on-failure
    environment: *api
    volumes:
      - radar_data:/radar_data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${RADAR_DB_PASSWORD:?run scripts/radar.sh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 3s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-alpine@sha256:d7af1c87c5f1eda13fcfca06db452bf3aeab6619fc3358b68535c0c02c4e52bc
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: radar
      RABBITMQ_DEFAULT_PASS: ${RADAR_BROKER_PASSWORD:?run scripts/radar.sh}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics check_port_connectivity"]
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 30

networks:
  default:
    # No route out: the scan needs only the pinned images.
    internal: true

volumes:
  postgres_data:
  radar_data:
