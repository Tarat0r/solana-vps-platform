[package]
name = "solana-auth-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
auth-core = { path = "../ssh/auth-core" }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# Lint levels for the gateway; ./static-analysis.sh runs Clippy with -D warnings.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
# A panic in the PAM module or daemon aborts a login; unwrap and expect are for tests (clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
# Expiry times are i64 on chain and u64/usize locally.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
strip = true
lto = "thin"
